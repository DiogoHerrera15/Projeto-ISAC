services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: isac
      POSTGRES_PASSWORD: isac_local_dev
      POSTGRES_DB: isac_market
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - isac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isac -d isac_market"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  isac_pgdata:
